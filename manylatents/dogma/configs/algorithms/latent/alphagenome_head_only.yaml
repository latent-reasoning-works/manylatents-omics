# Heads on frozen AlphaGenome site states: no edit, a track head reads the
# states at several readout layers (concatenated). The states are computed once
# and cached, so training costs one forward per variant and allele.
# Targets come from targets_path. Good practice: do not train on labels that
# you evaluate on.
_target_: manylatents.dogma.alphagenome.finetune.AlphaGenomeFinetune
layer: transformer_tower
readout_layers: [mha_block_4_input, transformer_tower]
fasta: null
sequence_length: 131072
model_version: fold_0
organism: HOMO_SAPIENS
hf_cache: null
policy: bfloat16  # or float32
window: 0
targets_from: path
targets_path: null
teacher_path: null
transform_output: head_output
val_fraction: 0.1
inference_batch_size: 2

intervention:
  _target_: manylatents.dogma.alphagenome.interventions.HeadOnly

objective:
  _target_: manylatents.dogma.alphagenome.objectives.TrackHead
  layers: [mha_block_4_input, transformer_tower]
  source: delta
  loss: mse
  hidden: 256

trainer:
  _target_: manylatents.dogma.alphagenome.train.JaxTrainer
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  max_steps: 5000
  batch_size: 64
  grad_clip: 1.0
  seed: 0
  log_every: 100
  eval_every: 250
  early_stop_patience: 8
  checkpoint_dir: null
  remat: false
