[project]
name = "manylatents-omics"
version = "0.1.2"
description = "Biological extensions for manylatents: popgen and central dogma encoders"
authors = [
    { name = "Latent Reasoning Works" },
]
readme = "README.md"
requires-python = ">=3.11, <3.13"
keywords = [
    "machine-learning",
    "dimensionality-reduction",
    "population-genetics",
    "foundation-models",
    "central-dogma",
]
license = "MIT"

dependencies = [
    "manylatents>=0.1.6",
]

[project.optional-dependencies]
# Domain data modules
# kinds (LabeledArray/SparseGraph) live in the standalone `manykinds` package,
# which brings xarray/zarr/sparse. xarray + sparse stay listed too — the adapters
# import them directly to build the DataArray before wrapping it in a kind.
# `scikit-image` and `scikit-misc` are NOT optional polish for `preprocessing`: scanpy raises
# on both. `sc.pp.scrublet` with no explicit threshold needs scikit-image to pick one
# ("`threshold` is None and thus scrublet requires `scikit-image`"), and
# `highly_variable_genes(flavor="seurat_v3")` needs scikit-misc for its loess fit. seurat_v3
# is the flavour that takes RAW counts, which is what a function sitting before `normalize`
# has to accept — so the dependency follows from where the step is, not from taste.
# `zarr<3` IS LOAD-BEARING AND IS NOT A PIN NOBODY REVISITED. anndata 0.11 accepts zarr 3
# during RESOLUTION and rejects it at IMPORT — the check is in `anndata/compat/__init__.py`,
# not in its metadata — so the resolver is satisfied and the failure lands at collection time.
# Measured on 2026-09-06, resolving CI's own command for linux/py3.11:
#
#     without this cap   anndata 0.11.4 · zarr 3.1.5  · archetypes 0.11.0  -> ImportError
#     with it            anndata 0.11.4 · zarr 2.18.7 · archetypes 0.11.0  -> imports clean
#
# The two resolutions differ in ONE package, which is what makes this the minimal fix rather
# than a version wall. That green CI on 2026-08-14 and red CI today came from the same commit
# is the whole point: `uv pip install .[...]` resolves fresh every run, so the job is a
# function of the calendar. The durable fix is to install from a lockfile, and it is blocked
# on `uv.lock` being gitignored here (`.gitignore:15`) — tracking it is a separate change.
#
# WHY NOT RAISE anndata INSTEAD, which is where a reader will go first: manylatents holds
# scipy below 1.15, that selects archetypes 0.11.0 which needs scipy<1.12, and anndata 0.12+
# needs scipy>=1.12. Asking for anndata>=0.12 therefore rolls archetypes back to 0.6.2 — a
# core algorithm dependency traded away to move a storage backend. Lift this cap when those
# SciPy bounds allow anndata 0.12 without that trade, not before.
singlecell = ["anndata>=0.11.3", "zarr<3", "geosketch>=1.3", "leidenalg>=0.10", "python-igraph>=1.0.0", "scanpy>=1.11.5", "scikit-image>=0.22", "scikit-misc>=0.3", "xarray>=2024.0", "sparse>=0.15", "manykinds>=0.1"]
popgen = ["pandas-plink>=2.2.9"]

# Protein + RNA encoders (ESM3 + Orthrus, torch 2.5.x compatible)
# DNA encoder (Evo2) requires separate venv — see scripts/setup-dna-venv.sh
dogma = ["esm>=3.0", "orthrus", "mamba-ssm==2.2.6.post3"]

# Utilities
gpu = ["faiss-gpu-cu12"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.6"]

# Full encoder development environment
dev = [
    "manylatents-omics[dogma,singlecell,popgen]",
    "pytest>=9.0.2",
]

[dependency-groups]
# CI needs pytest without the dev extra's dogma/ESM/Orthrus/mamba-ssm stack.
test = ["pytest>=9.0.2"]
cpu = ["torch", "torchvision"]
cuda = ["torch", "torchvision"]

[project.urls]
Homepage = "https://github.com/latent-reasoning-works/manylatents-omics"
Documentation = "https://latent-reasoning-works.github.io/manylatents-omics/"
Repository = "https://github.com/latent-reasoning-works/manylatents-omics"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project.entry-points."manylatents.extensions"]
omics = "manylatents.omics_plugin:OmicsSearchPathPlugin"

[tool.hatch.build.targets.wheel]
packages = ["manylatents"]

[tool.uv]
managed = true
no-build-isolation-package = ["mamba-ssm"]
# Preserve the local CUDA default. CI explicitly selects --no-default-groups --group cpu.
# Both routes belong in the lock; selecting them together cannot make one torch install.
default-groups = ["cuda"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# --no-sources would fall back to PyPI, whose Linux torch wheels include CUDA.
# macOS uses PyPI because the CUDA index has no macOS wheels.
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu121", group = "cuda", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu121", group = "cuda", marker = "sys_platform != 'darwin'" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "gpu: tests requiring GPU and model weights",
    "slow: tests that take significant time to run",
    "network: tests that download data over the network",
]

# Dependency metadata overrides
[[tool.uv.dependency-metadata]]
name = "heatgeo"
version = "0.0.1"
requires-dist = ["numpy>=1.23"]

# NOTE: an `archetypes` dependency-metadata override lived here, mirroring the one in
# manylatents. `dependency-metadata` is applied by the RESOLVING project, so deleting it
# upstream does not propagate — it had to go in both places. It hand-declared the wheel's
# requirements as scipy-only, which uv trusts, so archetypes installed without opt-einsum and
# pykronecker and `import archetypes` failed at runtime. See manylatents 393c695.

[[tool.uv.dependency-metadata]]
name = "magnipy"
version = "0.1.0"
requires-dist = ["torch>=2.4.1,<3.0.0", "scipy>=1.13.0,<1.15"]
